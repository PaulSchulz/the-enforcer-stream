  description: |
    B-2 bombers are on high alert for the orders to strike the Islamic Republic
    as the US is now preparing for massive strikes on Iran possibly within the next
    several hours. Over the day the number of US strikes on Iran has been far lower,
    with only a few key coastal targets reporting hits and damage. Meanwhile
    embassies of multiple countries throughout the region are now calling for alarm
    and evacuations ahead of "unprecedented escelations," and Israel is preparing to
    enter the war. Meanwhile the battles between the Saudi Kingdom and the Houthis
    have increased their attacks against Saudi ships in the Hormuz. Major Saudi
    strikes have hit key ports and cities under Houthi control. NATO air forces have
    shot down a Russian drone that was aimed directly at the Romanian capitol today
    in an unprecedented action. the drone was over 100 kilometers inside Romanian
    airspace, and is the first such incident of a drone shootdown inside of Romanian
    airspace during the war. Meanwhile Ukrainian missiles and drones have seen that
    great amounts of damage have been inflicted on the Russian's logistics and war
    industries, with more key targets being hit overnight. Ukrainian forces have
    held the line against Russian attacking forces, and stopped an further advances.

