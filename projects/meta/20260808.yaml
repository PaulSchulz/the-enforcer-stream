    lines, inflicting heavy losses on the Russian forces. News has emerged of a new
    defensive pact between the Saudis, Turks, and Pakistanis, while in Iran it is
    being claimed that the new Supreme Leader is on the very verge of death.
    Meanwhile the spat over the Hormuz has continued in it's normal fshion over the
    day.

