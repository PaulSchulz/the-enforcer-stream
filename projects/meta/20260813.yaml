  description: |
    Four Russian warships have been heavily damaged at the port of Novorossiysk from
    a overwhelming Ukrainian attack against the Black Sea Fleet. Several of Russia's
    largest ships have been damaged, some heavily, as a reuslt of the strikes which
    Russia was not able to intercept or destroy. Attacks continued on even
    throughout today, continuing to hit and destroy more major targets in the port
    as the hours pased by. Russia is panicking over the losses and damage being
    caused, which is being picked up on in NATO countries. Today a meetingt was held
    in the NATO HQ to discuss Russian escelations, and Lithuania opted to expand
    their defensive lines to make them more formidable, and slow down attacking
    forces. Ukraine has continued to inflict losses on the frontline forces,
    stopping most advances. Iran has threatened an attack on US soil if the US
    begins the conflict again, and have fired more anti ship missiles into the
    Strait of Hormuz. The Houthis also issued more serious threats against the
    Saudis today as well. Meanwhile the US is now claiming that they will take
    control over the Strait.

