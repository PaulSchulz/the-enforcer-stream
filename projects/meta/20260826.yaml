  morse: |
    SEEMS LIKE THE RUSSIAN FEDERATION IS GETTING EVER SO CLOSE TO A MAJOR ESCALATION
    WITH NATO, VERY CONCERNING. LLTLSA
  description: |
    US officials have warned Putin against a NATO attack during a visit made by
    CIA Director Ratcliffe earlier today to Moscow. The team flew in on a C-17
    globemaster, and departed immediately after the meeting was held. It is alleged
    that the Director referenced recon that was made in prior days on the
    Kaliningrad Oblast suggesting Russian forces buildups in the area. After the
    meeting, Putin then signed 3 secret presidential decrees; it is unknown whether
    these are related to the meeting. Mobilization is still being primed in Russia,
    with the government now working towards an actual framework for full
    mobilization on the ground. Moscow has once again come under heavy Ukrainian
    drone attacks, with alarms and alerts sounding that a large number of drones was
    on the way. Ukrainian forces have held the lines, and inflicted heavy losses
    onto the Russian armed forces along the frontlines. Meanwhile Iran is now also
    dealing with heavy pressure from fuel shortages, and the US is dedicating it's
    self to the US blockade. NATO forces keep preparing for further conflict with
    the Russian Federation.

