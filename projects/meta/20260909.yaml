  description: |
    Iran has launched a massive attack of over 40 Ballistic missiles into the
    Kingdom of Jordan, with Jordanian and US air defenses continuing to fire massive
    amounts of Patriots to intercept the incoming missiles. Heavy impact were seen
    on the area of Muwaffaq airbase, with Iran claiming a large number of losses for
    US forcesa although it is unclear if the damage was material or on the Personnel
    level. Earlier in the day, the US struck and disabled another 5 Oil tankers used
    by the Iranians, another crippling blow to their post-war export abilities. Iran
    has also used their proxy forces, the Yemeni Houthis, to launch a series of
    devastating strikes against Oil infrastructure in the southern part of the
    Kingdom. The Saudis vowed a terrible response. Meanwhile Ukraine has continued
    fighting the Russians on the frontline, retaking ground over the day near Lyman.
    Russia also saw it's Saratov refinery hit hard overnight along with a major port
    attack on Novorossiysk.

