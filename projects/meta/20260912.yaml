    Madinnah has been destroyed by Iraqi militia drone strikes. the Iraqi government
    has dismissed a military commander as a result and started a manhunt to try and
    find the group that fired the attacks. Meanwhile Ukraine has hit a massive zoon
    facility which is burning in the city of Saratov, and they have also damaged
    further Russian warships in more attacks. Ukrainian forces have also held the
    front lines today, inflciting heavy losses onto the Russian Army.

