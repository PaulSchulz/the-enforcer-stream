    Saudi Arabia has gone to war against Iranian proxy forces in western Yemen
    as the Houthis have been hit heavily by hundreds of airstrikes conducted by the
    Saudi Air Force. Houthi air defenses have attempted to shoot down Saudi aircraft
    over the city of Sanaa, and are also firing ballistic missiles at the Saudis in
    response. Yemeni government forces have been found to have major flaws with
    "ghost soldiering," becoming a significant issue within the ranks of the Yemeni
    armed forces, meaning that msot fighting units are only at 20% fighting
    strength, which is one of the primary causes leading to the rapid collpase of
    existing front lines. The IRGC has been firing at and attacking further merchant
    ships within the Strait of Hormuz over the day, hitting a few more vessels in
    the area. In Europe, A Russian drone crashed inside of northern Romania, causing
    a small fire while Bulgaria investigates an explosion that has happened for the
    second time this week at an arms factory. Russia is running dangerously low on
    fuel while the heads of Russian banks and finance beg the Russian government to
    cut spending in almost every way. Ukrainian forces have been able to hold the
    line.

