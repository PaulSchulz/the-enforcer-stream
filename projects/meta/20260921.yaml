  description: |
    Russia has shut down it's NATO borders today, imposing strict limitations on
    entry into the border zones as well as curfews stopping people from being out
    within certain hours of the night around the border regions. Belarus reactivated
    an abandoned railway line near to the Suwalki Gap, allowing for the rapid
    deployement of a large number of Russian forces into the direct border area with
    Lithuania and Poland. Meanwhile Ukrainian drones and missiles have rained down
    on Moscow, with Ukraine confirming they had used the FP-7 ballistic missile for
    the first time in history. Massive damage has been caused to Kopotnya, shutting
    down the entire refinery and immediately leading to extreme fuel rationing being
    declared in Moscow. The Sabovod shopping mall was also burning nearby to the
    Kopotnya Refinery. Further Pantsir missile failures were seen from the air
    defense forces. Meanwhile Ukraine has continued holding their ground and pushing
    the Russians back in the Lyman Front. Meanwhile Iran has threatened the US that
    if it strikes Iran or the Houthis they will go on the offensive once more. A
    massive ammo detonation also occured in Aleppo.

