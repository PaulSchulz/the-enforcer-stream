    A Russian attack helicopter has entered NATO airsapce in northern Poland today,
    staying in the area for over a minute before returning back into the Kaliningrad
    region. Polish government officials have stated that this is a clear provocation
    by the Russians, and another test of NATO responses. Meanwhile Polish
    authorities are also searching just west of the incident for a missing drone
    that was detected on radar and crashed in the area. Poland has also warned that
    Russia has mapped undersea cables used for financial transactions and may use
