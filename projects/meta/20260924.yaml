    soil. Iran is still battling an armed Balochistani uprising in the southeastern
    part of the country, with an IRGC top commander announced dead in the clashes
    still embroiling the sity of Saravan. IRGC forces have continued attacks on
    merchant ships in the Hormuz through the day, with one dead as a result of a
    direct hit. Ukraine has held the lines and inflicted heavy losses onto the
    Russian armed forces.

