    St. Petersburg is under a massive attack as Ukrainian drones have completely
    broken the air defense perimeter around the city and have begun to destroy the
    city hit-by-hit. Ukrainian drones have hit the largest bridge in the city, the
    largest oil depots in the city, and the VK data canter- the largest one also
    found in the city. Ukrainian forces have also conducted an attack on Moscow,
    with the airspace being closed once more by the Ukrainian drone forces filling
