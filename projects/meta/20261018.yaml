    the facilities- a first step towards preparing the grounds for an offensive. A
    British general has also announced today that the British government will be
    preparing the public for war in the near future. Meanwhile In the Middle East,
    Iran has fired at and hit two VLCC tankers in the Persian gulf, while also
    hitting a few more vessels in the Strait of Hormuz. Houthi forces have continued
    attacks on the Saudis and the Yemeni government as well, in an attempt to drive
    home earlier successes. Ukrainian forces have been able to hold the lines today
    and inflcit heavy losses onto the Russian armed forces.

