  description: |
    Moscow braces for a mass-casualty attack within the city of Moscow after US
    intelligence tipped off the Russian Federation warning them that an attack would
    be attempted on a museum within the city center, leading to the museum being
    shut down for the next 2 days as a large number of Russian armed police
    descended onto the scene. The Russian government is in a panic to find the
    would-be perpetrators, and stop them from reorganizing. In Jordan, battles have
    erupted on the border after armed combatants attempted to storm the border from
    Syria. Jordanian Armed Forces have been deployed into the area, and continue to
    engage this force. Meanwhile Iran has continued to make it clear that they will
    work towards conflict with the United States. Russian drones have breached
    Romanian airspace, forcing the Romanians to scramble air defenses to try and
    stop the incursion. Meanwhile Ukraine has hit another major Russian oil refinery
    in Ufa, to the sound of crickets in the White house as they appear to currently
    not be bothered by the resumption of attacks. Ukrainian forces have held the
    line and stopped any further advances over the course of the day.

